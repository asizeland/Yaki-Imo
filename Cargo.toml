[workspace]
resolver = "2"
members = [
    "pkg-core",
    "pkg-resolver",
    "pkg-db",
    "pkg-sandbox",
    "pkg-scanner",
    "pkg-repo",
    "pkg-build",
    "pkg-audit",
    "pkg-init",
    "pkg-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"

# Dependency pins per SPEC.md "Crate layout & dependency pins".
[workspace.dependencies]
serde = "1"
serde_derive = "1"
toml = "0.8"
sha2 = "0.10"
pubgrub = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"
goblin = "0.8"
which = "6"
ed25519-dalek = "2"
ureq = { version = "2", features = ["tls"] } # ureq 2's "tls" feature = rustls
serde_json = "1"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
libc = "0.2"
clap = { version = "4", features = ["derive"] }

# musl-static release profile (SPEC §17; mirrored in pkg-init/pkg-cli
# manifests as notes — profiles only take effect at the workspace root).
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
