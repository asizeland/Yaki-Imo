name = "pkgconf"
version = "2.3.0"
category = "dev-util"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://distfiles.ariadne.space/pkgconf/pkgconf-2.3.0.tar.xz"
sha256 = "3a9080ac51d03615e7c1910a0a2a8df08424892b5f13b0628a204d3fcce0ea8b"

[build]
system = "custom"

[scripts]
build = '''
tar xJf pkgconf-2.3.0.tar.xz
cd pkgconf-2.3.0
./configure --prefix=/usr --disable-static
make
'''
install = '''
make -C pkgconf-2.3.0 DESTDIR="$PKGDIR" install
# Everything autotools/meson calls it pkg-config.
ln -sf pkgconf "$PKGDIR/usr/bin/pkg-config"
'''
