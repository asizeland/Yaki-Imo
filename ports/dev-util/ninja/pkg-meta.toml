name = "ninja"
version = "1.12.1"
category = "dev-util"

# Bootstraps with python3 (a farm build tool here — no package dep).
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://github.com/ninja-build/ninja/archive/refs/tags/v1.12.1.tar.gz"
sha256 = "821bdff48a3f683bc4bb3b6f0b5fe7b2d647cf65d52aeb63328c91a6c6df285a"
# Upstream URL basename is just "v1.12.1.tar.gz"; stage it under the
# name the build script expects.
filename = "ninja-1.12.1.tar.gz"

[build]
system = "custom"

[scripts]
build = '''
tar xzf ninja-1.12.1.tar.gz
cd ninja-1.12.1
# -static-libstdc++/-static-libgcc: ninja is C++, and no package
# provides libstdc++ yet (that is the stage-2 toolchain's job) — the
# binary must not depend on the host compiler's runtime libs.
LDFLAGS="-static-libstdc++ -static-libgcc" python3 configure.py --bootstrap
'''
install = '''
mkdir -p "$PKGDIR/usr/bin"
cp ninja-1.12.1/ninja "$PKGDIR/usr/bin/"
'''
