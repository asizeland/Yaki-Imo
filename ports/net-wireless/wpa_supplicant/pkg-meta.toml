name = "wpa_supplicant"
version = "2.11"
category = "net-wireless"

# Wi-Fi authentication daemon; NetworkManager drives it over D-Bus
# (CONFIG_CTRL_IFACE_DBUS_NEW is on in the shipped defconfig). TLS is
# openssl. Build is .config-driven, not autotools.
[dependencies]
link = ["openssl", "libnl", "dbus"]
runtime = ["glibc", "openssl", "libnl", "dbus"]
build = ["pkgconf"]

[[source]]
url = "https://w1.fi/releases/wpa_supplicant-2.11.tar.gz"
sha256 = "912ea06f74e30a8e36fbb68064d6cdff218d8d591db0fc5d75dee6c81ac7fc0a"

[build]
system = "custom"

[scripts]
build = '''
tar xzf wpa_supplicant-2.11.tar.gz
cd wpa_supplicant-2.11/wpa_supplicant
cp defconfig .config
# The one knob defconfig leaves off that we want: TLS via openssl.
sed -i 's/^#CONFIG_TLS=openssl/CONFIG_TLS=openssl/' .config
export PATH="/pkg/deps/pkgconf/usr/bin:$PATH"
make BINDIR=/usr/sbin \
    EXTRA_CFLAGS="-I/pkg/deps/openssl/usr/include" \
    LDFLAGS="-L/pkg/deps/openssl/usr/lib -Wl,-rpath,/usr/lib"
'''
install = '''
make -C wpa_supplicant-2.11/wpa_supplicant \
    DESTDIR="$PKGDIR" BINDIR=/usr/sbin install
# D-Bus service activation file so NetworkManager can start it on demand.
mkdir -p "$PKGDIR/usr/share/dbus-1/system-services"
cp wpa_supplicant-2.11/wpa_supplicant/dbus/fi.w1.wpa_supplicant1.service \
    "$PKGDIR/usr/share/dbus-1/system-services/" 2>/dev/null || true
'''
