name = "glibc"
version = "2.42"
category = "sys-libs"

[dependencies]
build = ["linux-headers"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/glibc/glibc-2.42.tar.xz"
sha256 = "d1775e32e4628e64ef930f435b67bb63af7599acb6be2b335b9f19f16509f17f"

[build]
system = "custom"

[scripts]
build = '''
# glibc is -O3-fragile and is the ABI anchor of the whole system: pin
# its flags here, overriding whatever [build] opt_level profile the
# config declares. This is the sanctioned per-recipe escape hatch —
# and exactly why compute_abi_tag exempts glibc's base case from the
# profile mix-in: the profile cannot change these bits.
export CFLAGS="-O2"
export CXXFLAGS="-O2"
tar xJf glibc-2.42.tar.xz
mkdir -p glibc-build
cd glibc-build
# slibdir=/usr/lib: runtime DSOs (libc.so.6, libm, ...) land in
# /usr/lib like every other library in this layout, and the x86-64
# dl-cache macro then makes /usr/lib the loader's compiled-in default
# search dir (plus /usr/lib64, /usr/libx32) — no ld.so.conf needed for
# the base system. The loader itself still installs to its compiled-in
# name /lib64/ld-linux-x86-64.so.2 (elf/Makefile), which is exactly
# what every dynamically linked x86-64 binary asks the kernel for.
echo "slibdir=/usr/lib" > configparms
../glibc-2.42/configure --prefix=/usr --libdir=/usr/lib \
    --with-headers=/pkg/deps/linux-headers/usr/include \
    --enable-kernel=6.1 --disable-werror --disable-profile \
    --without-selinux
make
'''
install = '''
make -C glibc-build DESTDIR="$PKGDIR" install
# The loader cache is a generated host artifact, not package content:
# linking the build-sandbox copy over the live /etc/ld.so.cache would
# drop every directory the live ld.so.conf knew. Activation regenerates
# the live cache instead (see pkg-build's staging).
rm -f "$PKGDIR/etc/ld.so.cache"
# Scan-order drop-in: our libdir FIRST, so on a foreign root (another
# libc under a distro triarch dir like /usr/lib/x86_64-linux-gnu) the
# cache resolves libc.so.6 & co. to THIS glibc — loader and libc stay a
# consistent pair and foreign binaries keep working via forward compat.
mkdir -p "$PKGDIR/etc/ld.so.conf.d"
printf '/usr/lib\n/usr/lib64\n' > "$PKGDIR/etc/ld.so.conf.d/00-yakimo-glibc.conf"
'''
