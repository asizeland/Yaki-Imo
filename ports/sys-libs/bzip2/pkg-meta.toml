name = "bzip2"
version = "1.0.8"
category = "sys-libs"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
sha256 = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"

[build]
system = "custom"

[scripts]
build = '''
# Plain-Makefile package (no configure). The shared library is a
# separate make target upstream.
tar xzf bzip2-1.0.8.tar.gz
cd bzip2-1.0.8
make -f Makefile-libbz2_so
make
'''
install = '''
cd bzip2-1.0.8
make PREFIX="$PKGDIR/usr" install
# `make install` only ships the static lib; add the shared one.
mkdir -p "$PKGDIR/usr/lib"
cp -a libbz2.so.1.0.8 libbz2.so.1.0 "$PKGDIR/usr/lib/"
ln -sf libbz2.so.1.0.8 "$PKGDIR/usr/lib/libbz2.so"
ln -sf libbz2.so.1.0.8 "$PKGDIR/usr/lib/libbz2.so.1"
'''
