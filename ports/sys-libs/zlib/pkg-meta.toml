name = "zlib"
version = "1.3.1"
category = "sys-libs"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://zlib.net/fossils/zlib-1.3.1.tar.gz"
sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"

[build]
system = "custom"

[scripts]
build = '''
tar xzf zlib-1.3.1.tar.gz
cd zlib-1.3.1
./configure --prefix=/usr
make
'''
install = '''
make -C zlib-1.3.1 DESTDIR="$PKGDIR" install
'''
