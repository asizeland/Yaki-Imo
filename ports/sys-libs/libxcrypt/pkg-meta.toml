name = "libxcrypt"
version = "4.4.38"
category = "sys-libs"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://github.com/besser82/libxcrypt/releases/download/v4.4.38/libxcrypt-4.4.38.tar.xz"
sha256 = "80304b9c306ea799327f01d9a7549bdb28317789182631f1b54f4511b4206dd6"

[build]
system = "custom"

[scripts]
build = '''
tar xJf libxcrypt-4.4.38.tar.xz
cd libxcrypt-4.4.38
./configure --prefix=/usr --disable-static
make
'''
install = '''
make -C libxcrypt-4.4.38 DESTDIR="$PKGDIR" install
'''
