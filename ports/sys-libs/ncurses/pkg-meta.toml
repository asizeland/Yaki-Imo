name = "ncurses"
version = "6.5"
category = "sys-libs"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz"
sha256 = "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"

[build]
system = "custom"

[scripts]
build = '''
# Full autotools build with a data payload (the terminfo database is
# compiled by the freshly built `tic` during install). No C++ or Ada
# bindings: nothing in the tree uses them, and the C++ binding misdetects
# bool on modern GCC.
tar xzf ncurses-6.5.tar.gz
cd ncurses-6.5
./configure --prefix=/usr \
    --with-shared \
    --without-normal \
    --without-debug \
    --without-ada \
    --without-cxx \
    --without-cxx-binding \
    --enable-widec \
    --enable-pc-files \
    --with-pkg-config-libdir=/usr/lib/pkgconfig
make
'''
install = '''
cd ncurses-6.5
make DESTDIR="$PKGDIR" install
# Non-wide compatibility: dependents linking `-lncurses`/`-lcurses`
# get the wide library (LFS-style).
for lib in ncurses form panel menu; do
    ln -sf "lib${lib}w.so" "$PKGDIR/usr/lib/lib${lib}.so"
done
ln -sf libncursesw.so "$PKGDIR/usr/lib/libcurses.so"
'''
