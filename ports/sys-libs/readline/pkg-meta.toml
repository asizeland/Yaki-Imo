name = "readline"
version = "8.3"
category = "sys-libs"

[dependencies]
link = ["ncurses"]
runtime = ["glibc", "ncurses"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/readline/readline-8.3.tar.gz"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

[build]
system = "custom"

[scripts]
build = '''
tar xzf readline-8.3.tar.gz
cd readline-8.3
./configure --prefix=/usr --disable-static --with-curses \
    CPPFLAGS="-I/pkg/deps/ncurses/usr/include" \
    LDFLAGS="-L/pkg/deps/ncurses/usr/lib"
# The shared libs must record their ncurses dependency themselves.
make SHLIB_LIBS="-L/pkg/deps/ncurses/usr/lib -lncursesw"
'''
install = '''
make -C readline-8.3 DESTDIR="$PKGDIR" install
'''
