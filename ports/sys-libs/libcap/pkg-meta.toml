name = "libcap"
version = "2.76"
category = "sys-libs"

# POSIX capabilities library + tools (getcap/setcap/capsh/captree).
# bubblewrap links against it; the tools are also how a live system
# inspects and grants file capabilities.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://mirrors.edge.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.76.tar.xz"
sha256 = "629da4ab29900d0f7fcc36227073743119925fd711c99a1689bbf5c9b40c8e6f"

[build]
system = "custom"

[scripts]
build = '''
# Plain Makefile package (no configure). The Go bindings and the PAM
# module stay off: no Go toolchain or PAM in the tree.
tar xJf libcap-2.76.tar.xz
cd libcap-2.76
make prefix=/usr lib=lib GOLANG=no PAM_CAP=no
'''
install = '''
cd libcap-2.76
make prefix=/usr lib=lib GOLANG=no PAM_CAP=no DESTDIR="$PKGDIR" install
'''
