name = "lua"
version = "5.4.7"
category = "dev-lang"

[dependencies]
runtime = ["glibc"]

# add_deps pulls readline into the transaction only when the option is
# enabled — §4.3 additive deps. ncurses rides along because GNU ld does
# not honor a shared library's RUNPATH transitively at link time
# (RUNPATH is non-transitive by design; that is what distinguishes it
# from RPATH): resolving libreadline's undefined tget* symbols needs
# -lncursesw on lua's own link line, which needs /pkg/deps/ncurses
# bound into lua's build sandbox.
[options.readline]
default = false
description = "Interactive-line editing via readline"
add_deps = ["readline", "ncurses"]
