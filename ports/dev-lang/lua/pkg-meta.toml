name = "lua"
version = "5.4.7"
category = "dev-lang"

[[source]]
url = "https://www.lua.org/ftp/lua-5.4.7.tar.gz"
sha256 = "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30"

[dependencies]
runtime = ["glibc"]

# add_deps pulls readline into the transaction only when the option is
# enabled — §4.3 additive deps. ncurses rides along because GNU ld does
# not honor a shared library's RUNPATH transitively at link time
# (RUNPATH is non-transitive by design; that is what distinguishes it
# from RPATH): resolving libreadline's undefined tget* symbols needs
# -lncursesw on lua's own link line, which needs /pkg/deps/ncurses
# bound into lua's build sandbox.
[options.readline]
default = false
description = "Interactive-line editing via readline"
add_deps = ["readline", "ncurses"]

[build]
system = "custom"

[scripts]
build = '''
# Plain-Makefile package; upstream 5.4 has explicit
# linux / linux-readline targets for the option to select between.
tar xzf lua-5.4.7.tar.gz
cd lua-5.4.7
if [ "$PKG_OPT_READLINE" = "1" ]; then
    make linux-readline \
        MYCFLAGS="-I/pkg/deps/readline/usr/include" \
        MYLIBS="-L/pkg/deps/readline/usr/lib -lreadline \
                -L/pkg/deps/ncurses/usr/lib -lncursesw \
                -Wl,-rpath,/usr/lib"
else
    make linux MYLIBS="-Wl,-rpath,/usr/lib"
fi
'''
install = '''
make -C lua-5.4.7 install INSTALL_TOP="$PKGDIR/usr"
'''
