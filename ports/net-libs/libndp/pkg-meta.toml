name = "libndp"
version = "1.9"
category = "net-libs"

# Neighbor Discovery Protocol (IPv6 RA) library; NetworkManager needs it.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://deb.debian.org/debian/pool/main/libn/libndp/libndp_1.9.orig.tar.gz"
sha256 = "e564f5914a6b1b799c3afa64c258824a801c1b79a29e2fe6525b682249c65261"
# Upstream (libndp.org) is a broken GitHub Pages site; Debian's pool
# carries the identical checkout.
filename = "libndp-1.9.tar.gz"

[build]
system = "custom"

[scripts]
build = '''
# libndp's dist tarballs (libndp.org, and even Debian's orig.tar.gz)
# are git checkouts without a generated configure — upstream expects
# autoreconf, and autoconf/automake/libtool are not packaged yet. The
# library is a single translation unit (libndp/libndp.c, version-info
# 3:0:3 → soname libndp.so.0), so the recipe compiles it directly.
tar xzf libndp-1.9.tar.gz
cd libndp-1.9
cc -O2 -fPIC -fvisibility=hidden -ffunction-sections -fdata-sections \
    -Iinclude -D_GNU_SOURCE -c libndp/libndp.c -o libndp.o
cc -shared -Wl,--gc-sections -Wl,--as-needed \
    -Wl,-soname,libndp.so.0 -o libndp.so.0.3.0 libndp.o
cc -O2 -Iinclude -D_GNU_SOURCE utils/ndptool.c -o ndptool \
    -L. -l:libndp.so.0.3.0 -Wl,-rpath,/usr/lib
'''
install = '''
mkdir -p "$PKGDIR/usr/lib" "$PKGDIR/usr/lib/pkgconfig" "$PKGDIR/usr/include" "$PKGDIR/usr/bin"
cp libndp-1.9/libndp.so.0.3.0 "$PKGDIR/usr/lib/"
ln -s libndp.so.0.3.0 "$PKGDIR/usr/lib/libndp.so.0"
ln -s libndp.so.0 "$PKGDIR/usr/lib/libndp.so"
cp libndp-1.9/include/ndp.h "$PKGDIR/usr/include/"
cp libndp-1.9/ndptool "$PKGDIR/usr/bin/"
# The .pc's hardcoded prefix=/usr is rewritten to ${pcfiledir}-relative
# form by the post-install fixup.
cat > "$PKGDIR/usr/lib/pkgconfig/libndp.pc" <<'EOF'
prefix=/usr
exec_prefix=${prefix}
libdir=${exec_prefix}/lib
includedir=${prefix}/include

Name: libndp
Description: Neighbor Discovery Protocol library
Version: 1.9
Libs: -L${libdir} -lndp
Cflags: -I${includedir}
EOF
'''
