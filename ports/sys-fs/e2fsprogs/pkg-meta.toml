name = "e2fsprogs"
version = "1.47.2"
category = "sys-fs"

# mkfs.ext4/e2fsck/tune2fs/resize2fs — needed to make and check the
# filesystems a live install boots from. libuuid/libblkid come from
# util-linux (bundled copies disabled to avoid a file collision).
[dependencies]
link = ["util-linux"]
runtime = ["glibc", "util-linux"]
build = ["pkgconf"]

[[source]]
url = "https://mirrors.edge.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.2/e2fsprogs-1.47.2.tar.xz"
sha256 = "08242e64ca0e8194d9c1caad49762b19209a06318199b63ce74ae4ef2d74e63c"

[build]
system = "custom"

[scripts]
build = '''
tar xJf e2fsprogs-1.47.2.tar.xz
mkdir -p e2fs-build
cd e2fs-build
export PATH="/pkg/deps/pkgconf/usr/bin:$PATH"
# --disable-libuuid/--disable-libblkid: use util-linux's libraries
# (bundled copies would collide with util-linux's files in the store).
../e2fsprogs-1.47.2/configure --prefix=/usr --enable-elf-shlibs \
    --disable-libuuid --disable-uuidd --disable-libblkid \
    CPPFLAGS="-I/pkg/deps/util-linux/usr/include" \
    LDFLAGS="-L/pkg/deps/util-linux/usr/lib -Wl,-rpath,/usr/lib"
make
'''
install = '''
make -C e2fs-build DESTDIR="$PKGDIR" install
'''
