name = "grep"
version = "3.12"
category = "sys-apps"

[dependencies]
link = ["pcre2"]
runtime = ["glibc", "pcre2"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/grep/grep-3.12.tar.xz"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"

[build]
system = "custom"

[scripts]
build = '''
tar xJf grep-3.12.tar.xz
cd grep-3.12
./configure --prefix=/usr --disable-nls
make
'''
install = '''
make -C grep-3.12 DESTDIR="$PKGDIR" install
'''
