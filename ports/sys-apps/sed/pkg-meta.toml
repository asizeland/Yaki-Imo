name = "sed"
version = "4.10"
category = "sys-apps"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/sed/sed-4.10.tar.xz"
sha256 = "b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7"

[build]
system = "autotools"
# No SELinux recipe exists; this also prevents host-library leakage.
configure_args = ["--disable-nls", "--without-selinux"]
