name = "tar"
version = "1.35"
category = "sys-apps"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/tar/tar-1.35.tar.xz"
sha256 = "4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16"

[build]
system = "custom"

[scripts]
build = '''
tar xJf tar-1.35.tar.xz
cd tar-1.35
# --without-selinux: no selinux in the tree; the host's libselinux
# would leak in undeclared (gate-fatal).
./configure --prefix=/usr --disable-nls --without-selinux
make
'''
install = '''
make -C tar-1.35 DESTDIR="$PKGDIR" install
'''
