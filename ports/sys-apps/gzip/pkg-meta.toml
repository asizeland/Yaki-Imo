name = "gzip"
version = "1.15"
category = "sys-apps"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/gzip/gzip-1.15.tar.xz"
sha256 = "9aa0cc780dec156b8282844833b342ab7cb08c25d2cd9a1869cdd0df31deff48"

[build]
system = "custom"

[scripts]
build = '''
tar xJf gzip-1.15.tar.xz
cd gzip-1.15
./configure --prefix=/usr --disable-nls
make
'''
install = '''
make -C gzip-1.15 DESTDIR="$PKGDIR" install
'''
