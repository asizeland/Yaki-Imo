name = "iproute2"
version = "6.15.0"
category = "sys-apps"

# ip/ss/tc — the network configuration toolkit. tc needs bison+flex
# (sandbox farm build tools).
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/net/iproute2/iproute2-6.15.0.tar.xz"
sha256 = "8041854a882583ad5263466736c9c8c68c74b1a35754ab770d23343f947528fb"

[build]
system = "custom"

[scripts]
build = '''
tar xJf iproute2-6.15.0.tar.xz
cd iproute2-6.15.0
./configure
# No Berkeley DB or SELinux in the tree: arpd and ss's selinux support
# would otherwise link the HOST's libdb/libselinux through the read-only
# host binds (undeclared, gate-fatal).
sed -i -e 's/^HAVE_BERKELEY_DB.*/HAVE_BERKELEY_DB=n/' \
       -e 's/^HAVE_SELINUX.*/HAVE_SELINUX=n/' \
       -e '/^LDLIBS += -lselinux/d' \
       -e '/^CFLAGS += -DHAVE_SELINUX/d' \
    config.mk
make PREFIX=/usr SBINDIR=/usr/sbin
'''
install = '''
make -C iproute2-6.15.0 DESTDIR="$PKGDIR" PREFIX=/usr SBINDIR=/usr/sbin install
'''
