name = "findutils"
version = "4.10.0"
category = "sys-apps"

# find/xargs — the build sandbox's shim dispatcher is xargs, and
# configure scripts everywhere call find.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz"
sha256 = "1387e0b67ff247d2abde998f90dfbf70c1491391a59ddfecb8ae698789f0a4f5"

[build]
system = "custom"

[scripts]
build = '''
tar xJf findutils-4.10.0.tar.xz
cd findutils-4.10.0
# --without-selinux: none in the tree; the host's libselinux would
# leak in undeclared (gate-fatal).
./configure --prefix=/usr --disable-nls --without-selinux
make
'''
install = '''
make -C findutils-4.10.0 DESTDIR="$PKGDIR" install
'''
