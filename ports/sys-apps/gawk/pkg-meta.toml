name = "gawk"
version = "5.4.1"
category = "sys-apps"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/gawk/gawk-5.4.1.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"

[build]
system = "custom"

[scripts]
build = '''
tar xJf gawk-5.4.1.tar.xz
cd gawk-5.4.1
# --without-readline: only the interactive debugger uses it, and the
# HOST's libreadline would leak in undeclared (gate-fatal).
./configure --prefix=/usr --disable-nls --without-readline
make
'''
install = '''
make -C gawk-5.4.1 DESTDIR="$PKGDIR" install
'''
