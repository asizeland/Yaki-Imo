name = "kmod"
version = "34.1"
category = "sys-apps"

# Kernel module tools: modprobe/insmod/lsmod/depmod. kmod 33+ is
# meson-only. Compressed modules via xz/zlib; PKCS#7 module signatures
# via openssl; zstd off (not packaged).
[dependencies]
link = ["xz", "zlib", "openssl"]
runtime = ["glibc", "xz", "zlib", "openssl"]
build = ["meson", "ninja", "python3", "pkgconf"]

[[source]]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.1.tar.xz"
sha256 = "125957c9125fc5db1bd6a2641a1c9a6a0b500882fb8ccf7fb6483fcae5309b17"

[build]
system = "custom"

[scripts]
build = '''
tar xJf kmod-34.1.tar.xz
export PATH="/pkg/deps/meson/usr/bin:/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:/pkg/deps/pkgconf/usr/bin:$PATH"
meson setup kmod-34.1 kmod-build \
    --prefix=/usr --libdir=/usr/lib --buildtype=release \
    -Dzstd=disabled -Dopenssl=enabled \
    -Dmanpages=false -Ddocs=false -Dbuild-tests=false \
    -Dbashcompletiondir=no -Dfishcompletiondir=no -Dzshcompletiondir=no
ninja -C kmod-build
'''
install = '''
export PATH="/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:$PATH"
DESTDIR="$PKGDIR" ninja -C kmod-build install
'''
