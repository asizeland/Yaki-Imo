name = "man-pages"
version = "6.9"
category = "sys-apps"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://mirrors.edge.kernel.org/pub/linux/docs/man-pages/man-pages-6.9.tar.xz"
sha256 = "d14caff54cc662f34b1b70bcf62d4e27e4c2fd260672a35b6e74af71b3f71f88"

[build]
system = "custom"

[scripts]
build = '''
# Data-only package: the build phase is just the unpack (a package
# with nothing to compile still goes through the phase pipeline).
tar xJf man-pages-6.9.tar.xz
'''
install = '''
make -C man-pages-6.9 install prefix=/usr DESTDIR="$PKGDIR"
'''
