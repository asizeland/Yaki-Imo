name = "util-linux"
version = "2.41.1"
category = "sys-apps"

# The system tool kit: mount/blkid/fdisk/dmesg and the libuuid,
# libblkid, libmount libraries (libuuid is also a NetworkManager dep).
# login/su/sulogin are left to shadow/sysvinit territory; systemd
# integration is off (sysvinit system). zlib is declared (fsck.cramfs)
# — undeclared, configure would link the HOST's zlib instead.
[dependencies]
link = ["ncurses", "zlib"]
runtime = ["glibc", "ncurses", "zlib"]
build = ["pkgconf"]

[[source]]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.41/util-linux-2.41.1.tar.xz"
sha256 = "be9ad9a276f4305ab7dd2f5225c8be1ff54352f565ff4dede9628c1aaa7dec57"

[build]
system = "custom"

[scripts]
build = '''
tar xJf util-linux-2.41.1.tar.xz
cd util-linux-2.41.1
# tools/all_errnos + all_syscalls ship with #!/bin/bash, and /bin/bash
# does not exist in the build sandbox — repoint them at the farm bash.
sed -i '1s|^#!/bin/bash|#!/usr/bin/bash|' tools/all_errnos tools/all_syscalls
export PATH="/pkg/deps/pkgconf/usr/bin:$PATH"
# --disable-liblastlog2: lastlog2 wants sqlite3; not worth the dep.
# --without-tinfo / --without-readline: dmesg's colors and fdisk's
# prompts would otherwise pick up the HOST's libtinfo/libreadline
# through the read-only host binds — undeclared linkage, gate-fatal.
# --libdir=/usr/lib: util-linux defaults shared libs to /lib, but the
# loader's compiled-in search path is /usr/lib — anything linking
# libblkid/libmount/libuuid would fail at runtime.
./configure --prefix=/usr --libdir=/usr/lib --disable-static \
    --enable-libuuid --enable-libblkid --enable-libmount \
    --disable-liblastlog2 --without-tinfo --without-readline \
    --disable-login --disable-nologin --disable-sulogin \
    --disable-su --disable-runuser --disable-chfn-chsh \
    --without-systemd --without-udev --without-python \
    --disable-pylibmount \
    --disable-makeinstall-chown --disable-makeinstall-setuid \
    CPPFLAGS="-I/pkg/deps/ncurses/usr/include" \
    LDFLAGS="-L/pkg/deps/ncurses/usr/lib -Wl,-rpath,/usr/lib"
make
'''
install = '''
make -C util-linux-2.41.1 DESTDIR="$PKGDIR" install
'''
