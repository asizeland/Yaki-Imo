name = "tty-solitaire"
version = "1.3.1"
category = "games-misc"

[[source]]
url = "https://github.com/mpereira/tty-solitaire/archive/refs/tags/v1.3.1.tar.gz"
sha256 = "f2b80c8d5317e67db43c1dbf3b0f5f3dfea5e826c18744562615f1b1536ae433"
# GitHub's auto-archive basename (v1.3.1.tar.gz) is ambiguous; the tree
# stages it under a package-qualified name instead.
filename = "tty-solitaire-1.3.1.tar.gz"

[dependencies]
link = ["ncurses"]
runtime = ["glibc", "ncurses"]

[build]
system = "custom"

[scripts]
build = '''
# Plain-Makefile game against ncurses. The Makefile's own LDFLAGS
# (-lncursesw on Linux) is lost to a command-line override, so our
# override must carry it.
tar xzf tty-solitaire-1.3.1.tar.gz
cd tty-solitaire-1.3.1
make CC=cc \
    CFLAGS="-O2 -std=c99 -fcommon -I/pkg/deps/ncurses/usr/include" \
    LDFLAGS="-L/pkg/deps/ncurses/usr/lib -Wl,-rpath,/usr/lib -lncursesw"
'''
install = '''
make -C tty-solitaire-1.3.1 install PREFIX=/usr DESTDIR="$PKGDIR"
'''
