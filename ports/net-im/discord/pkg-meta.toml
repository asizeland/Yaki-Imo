name = "discord"
version = "1.0.161"
category = "net-im"

[dependencies]
runtime = ["glibc"]

# Vendor binary repackaging: relaxes the scanner's undeclared-soname
# check to warnings (the blob ships its own bundled libs).
[build]
binary = true
system = "custom"

# Discord deletes old versioned tarballs; bump version + hash together
# (the unversioned `?platform=linux&format=tar.gz` endpoint always
# redirects to the current one).
[[source]]
url = "https://dl.discordapp.net/apps/linux/1.0.161/discord-1.0.161.tar.gz"
sha256 = "5f1e2349a5602b98fabbbfe222c51bbb5c59c77ffc1e7b1d7bc0d86f96ef0af8"

[scripts]
install = '''
tar xzf discord-1.0.161.tar.gz
mkdir -p "$PKGDIR/usr/lib/discord" "$PKGDIR/usr/bin" \
         "$PKGDIR/usr/share/applications" "$PKGDIR/usr/share/pixmaps"
cp -r Discord/. "$PKGDIR/usr/lib/discord/"
# The vendor launcher is a shell script that bootstraps the real client
# into the user's config dir on first run; install it as the command.
cp Discord/discord "$PKGDIR/usr/bin/discord"
chmod 755 "$PKGDIR/usr/bin/discord"
cp Discord/discord.desktop "$PKGDIR/usr/share/applications/"
cp Discord/discord.png "$PKGDIR/usr/share/pixmaps/discord.png"
'''
