name = "make"
version = "4.4.1"
category = "sys-devel"

# GNU make — core build-farm tool, needed so a live system can build
# its own packages without the seed toolchain.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/make/make-4.4.1.tar.gz"
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"

[build]
system = "custom"

[scripts]
build = '''
tar xzf make-4.4.1.tar.gz
cd make-4.4.1
./configure --prefix=/usr --disable-nls
make
'''
install = '''
make -C make-4.4.1 DESTDIR="$PKGDIR" install
'''
