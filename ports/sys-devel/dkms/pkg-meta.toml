name = "dkms"
version = "3.3.0"
category = "sys-devel"

[dependencies]
runtime = ["bash", "coreutils", "gawk", "grep", "sed", "findutils", "kmod", "gcc", "make"]
build = ["make"]

[[source]]
url = "https://github.com/dell/dkms/archive/refs/tags/v3.3.0.tar.gz"
filename = "dkms-3.3.0.tar.gz"
sha256 = "ef4ca9da2062f49bac224e6de9886266038378c0938b2cfa7c6c179d366a148c"

[build]
system = "custom"

[scripts]
build = '''
tar xzf dkms-3.3.0.tar.gz
make -C dkms-3.3.0
'''
install = '''
make -C dkms-3.3.0 DESTDIR="$PKGDIR" install install-doc
'''
