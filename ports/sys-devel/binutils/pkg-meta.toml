name = "binutils"
version = "2.45"
category = "sys-devel"

# Assembler, linker and friends — the back half of the toolchain; gcc
# drives as/ld at runtime. Out-of-tree build as upstream recommends.
[dependencies]
link = ["zlib"]
runtime = ["glibc", "zlib"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/binutils/binutils-2.45.tar.xz"
sha256 = "c50c0e7f9cb188980e2cc97e4537626b1672441815587f1eab69d2a1bfbef5d2"

[build]
system = "custom"

[scripts]
build = '''
tar xJf binutils-2.45.tar.xz
mkdir binutils-build
cd binutils-build
# --without-zstd: compressed debug sections are optional, and the
# host's libzstd would leak in undeclared (gate-fatal).
../binutils-2.45/configure \
    --prefix=/usr \
    --disable-nls \
    --disable-werror \
    --disable-gprofng \
    --without-zstd \
    --enable-plugins \
    --enable-ld=default \
    --enable-shared
make
'''
install = '''
make -C binutils-build DESTDIR="$PKGDIR" install
'''
