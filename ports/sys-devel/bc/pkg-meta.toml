name = "bc"
version = "1.08.2"
category = "sys-devel"

[dependencies]
runtime = ["glibc"]
build = ["make"]

[[source]]
url = "https://ftpmirror.gnu.org/bc/bc-1.08.2.tar.gz"
sha256 = "ae470fec429775653e042015edc928d07c8c3b2fc59765172a330d3d87785f86"

[build]
system = "custom"

[scripts]
build = '''
tar xzf bc-1.08.2.tar.gz
cd bc-1.08.2
./configure --prefix=/usr --without-readline --without-libedit
make MAKEINFO=true
'''
install = '''
make -C bc-1.08.2 DESTDIR="$PKGDIR" MAKEINFO=true install
'''
