name = "gcc"
version = "15.2.0"
category = "sys-devel"

# The compiler. C and C++ only; no bootstrap (the seed toolchain is
# already a gcc of the same major generation, and a full 3-stage
# bootstrap roughly triples the build time). Ships libgcc and
# libstdc++, which also retire the static-C++ workarounds in the ninja
# and gnutls recipes once the tree is rebuilt on this toolchain.
# Drives binutils' as/ld at runtime. libcc1 is off: it's GDB's
# compile-plugin glue, and its libtool link hits the same
# unknown-CXX-tag static-only trap gettext's libasprintf did.
[dependencies]
link = ["gmp", "mpfr", "mpc", "zlib"]
runtime = ["glibc", "binutils", "gmp", "mpfr", "mpc", "zlib"]
build = ["linux-headers"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz"
sha256 = "438fd996826b0c82485a29da03a72d71d6e3541a83ec702df4271f6fe025d24e"

[build]
system = "custom"

[scripts]
build = '''
tar xJf gcc-15.2.0.tar.xz
# Native build in the sandbox has no /usr/include: fixincludes and the
# target runtime libraries (libgcc, libstdc++) need the target system
# headers. Assemble a build sysroot from the packaged glibc + kernel
# headers. --with-build-sysroot affects only the build; the installed
# compiler keeps the native /usr defaults.
mkdir -p sysroot
cp -rL /pkg/deps/glibc/. sysroot/
cp -rL /pkg/deps/linux-headers/usr/include sysroot/usr/
# --without-zstd: LTO bytecode compression is optional, and the host's
# libzstd would leak into lto-dump undeclared (gate-fatal).
# LIBRARY_PATH carries every declared dep's lib dir — including
# glibc's. xgcc's target-lib links pass --sysroot=<the build sysroot>
# and rely on ld's script-inside-sysroot path rewriting; but a libc.so
# found via LIBRARY_PATH (/pkg/deps/glibc, read-only) is OUTSIDE the
# sysroot, so no rewriting happens and the script's absolute
# GROUP(/usr/lib/libc.so.6 ...) points into the void. Drop the glibc
# entry: host links (cc1 etc.) use the farm compiler's own libc
# defaults, and xgcc must resolve -lc through the sysroot.
LP_FILTERED=$(printf '%s' "$LIBRARY_PATH" | tr ':' '\n' \
    | grep -v '/pkg/deps/glibc/' | tr '\n' ':')
LIBRARY_PATH=${LP_FILTERED%:}
export LIBRARY_PATH
mkdir gcc-build
cd gcc-build
../gcc-15.2.0/configure \
    --prefix=/usr \
    --libdir=/usr/lib \
    --enable-languages=c,c++ \
    --disable-multilib \
    --disable-nls \
    --disable-bootstrap \
    --with-system-zlib \
    --without-zstd \
    --with-build-sysroot="$PWD/../sysroot" \
    --disable-libcc1
make
'''
install = '''
make -C gcc-build DESTDIR="$PKGDIR" install
# x86_64 gcc installs its target runtime libs (libgcc_s, libstdc++,
# libgomp, ...) to usr/lib64 even with --disable-multilib, but the
# packaged loader's compiled-in default search path is /usr/lib. Merge
# lib64 into lib and leave a compat symlink behind — gcc's own driver
# still probes lib64 at link time.
if [ -d "$PKGDIR/usr/lib64" ]; then
    cp -rl "$PKGDIR/usr/lib64/." "$PKGDIR/usr/lib/"
    rm -rf "$PKGDIR/usr/lib64"
    ln -s lib "$PKGDIR/usr/lib64"
fi
'''
