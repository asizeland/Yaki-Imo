name = "bison"
version = "3.8.2"
category = "sys-devel"

# Parser generator. Runs m4 at runtime on its skeletons.
[dependencies]
runtime = ["glibc", "m4"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

[build]
system = "custom"

[scripts]
build = '''
tar xJf bison-3.8.2.tar.xz
cd bison-3.8.2
./configure --prefix=/usr --disable-nls
make
'''
install = '''
make -C bison-3.8.2 DESTDIR="$PKGDIR" install
'''
