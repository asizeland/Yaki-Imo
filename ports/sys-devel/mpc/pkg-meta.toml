name = "mpc"
version = "1.3.1"
category = "sys-devel"

# Multiple-precision complex arithmetic library — GCC requires it.
[dependencies]
link = ["gmp", "mpfr"]
runtime = ["glibc", "gmp", "mpfr"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz"
sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"

[build]
system = "custom"

[scripts]
build = '''
tar xzf mpc-1.3.1.tar.gz
cd mpc-1.3.1
./configure --prefix=/usr --disable-nls
make
'''
install = '''
make -C mpc-1.3.1 DESTDIR="$PKGDIR" install
'''
