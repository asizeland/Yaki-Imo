name = "linux-headers"
version = "6.19.14"
category = "sys-kernel"

[[source]]
url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.19.14.tar.xz"
sha256 = "cde8bf6739be4a0777fedbbba5330b8188c55680c45a922a4dfa289cbec6f185"

[build]
system = "custom"

[scripts]
build = '''
tar xJf linux-6.19.14.tar.xz
# "make headers" sanitizes the kernel UAPI headers into usr/include.
# headers_install is not used: it needs rsync, which is not in the
# sandbox. The manual copy in the install phase is what LFS does.
make -C linux-6.19.14 headers
'''
install = '''
find linux-6.19.14/usr/include -type f ! -name '*.h' -delete
mkdir -p "$PKGDIR/usr"
cp -r linux-6.19.14/usr/include "$PKGDIR/usr/"
'''
