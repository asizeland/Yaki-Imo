name = "curl"
version = "8.14.1"
category = "net-misc"

[dependencies]
link = ["openssl", "zlib"]
runtime = ["glibc", "openssl", "zlib", "ca-certificates"]

[[source]]
url = "https://curl.se/download/curl-8.14.1.tar.xz"
sha256 = "f4619a1e2474c4bbfedc88a7c2191209c8334b48fa1f4e53fd584cc12e9120dd"

[build]
system = "custom"

[scripts]
build = '''
tar xJf curl-8.14.1.tar.xz
cd curl-8.14.1
./configure --prefix=/usr --disable-static \
    --with-openssl=/pkg/deps/openssl/usr \
    --with-zlib=/pkg/deps/zlib/usr \
    --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt \
    --with-ca-path=/etc/ssl/certs \
    --without-libpsl --without-brotli --without-zstd \
    --without-nghttp2 --without-libidn2 --without-librtmp \
    --disable-ldap --disable-ldaps
make
'''
install = '''
make -C curl-8.14.1 DESTDIR="$PKGDIR" install
'''
