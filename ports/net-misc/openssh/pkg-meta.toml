name = "openssh"
version = "10.0.1"
category = "net-misc"

# ssh client + sshd. No PAM (not packaged); privilege separation uses
# /var/empty. libcrypt (libxcrypt) is declared explicitly: password
# crypt() support — without declaring it, configure picks up the HOST's
# libcrypt through the read-only host binds (undeclared, gate-fatal).
# Runtime setup (host keys, sshd user) is a live-system step, not a
# package one.
[dependencies]
link = ["openssl", "zlib", "libxcrypt"]
runtime = ["glibc", "openssl", "zlib", "libxcrypt"]

[[source]]
url = "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.0p1.tar.gz"
sha256 = "021a2e709a0edf4250b1256bd5a9e500411a90dddabea830ed59cef90eb9d85c"

[build]
system = "custom"

[scripts]
build = '''
tar xzf openssh-10.0p1.tar.gz
cd openssh-10.0p1
./configure --prefix=/usr --sysconfdir=/etc/ssh \
    --with-ssl-dir=/pkg/deps/openssl/usr \
    --without-pam --without-selinux \
    --with-privsep-path=/var/empty \
    CPPFLAGS="-I/pkg/deps/zlib/usr/include" \
    LDFLAGS="-L/pkg/deps/zlib/usr/lib -Wl,-rpath,/usr/lib"
make
'''
install = '''
make -C openssh-10.0p1 DESTDIR="$PKGDIR" install
mkdir -p "$PKGDIR/var/empty"
'''
