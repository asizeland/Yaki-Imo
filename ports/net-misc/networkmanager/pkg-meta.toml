name = "networkmanager"
version = "1.50.0"
category = "net-misc"

# The network daemon + nmcli. Configured for a sysvinit/eudev system:
# no systemd units, no polkit (root-only auth), internal DHCP client,
# keyfile config plugin, resolv.conf written directly, gnutls crypto,
# Wi-Fi via wpa_supplicant. ppp/modem/ovs/team/iwd are off (nothing
# packaged to back them yet).
[dependencies]
link = ["glib", "dbus", "libnl", "jansson", "libndp", "util-linux", "gnutls", "curl", "readline", "eudev"]
runtime = ["glibc", "glib", "dbus", "libnl", "jansson", "libndp", "util-linux", "gnutls", "curl", "readline", "eudev", "wpa_supplicant", "ca-certificates"]
build = ["meson", "ninja", "python3", "pkgconf"]

[[source]]
url = "https://download.gnome.org/sources/NetworkManager/1.50/NetworkManager-1.50.0.tar.xz"
sha256 = "fc03e7388a656cebc454c5d89481626122b1975d7c26babc64dc7e488faa66e3"

[build]
system = "custom"

[scripts]
build = '''
tar xJf NetworkManager-1.50.0.tar.xz
cd NetworkManager-1.50.0
# meson.build looks up xsltproc unconditionally, but only the docs=true
# path (off here) ever invokes it. libxslt isn't packaged; demote the
# lookup instead of stubbing a tool.
sed -i "s/find_program('xsltproc')/find_program('xsltproc', required: false)/" meson.build
meson setup . ../nm-build \
    --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var \
    --buildtype=release \
    -Dsystemdsystemunitdir=no -Dsession_tracking=no -Dsystemd_journal=false \
    -Dsuspend_resume=auto \
    -Dpolkit=false -Dconfig_auth_polkit_default=root-only \
    -Dselinux=false -Dlibaudit=no \
    -Dwifi=true -Dwext=true -Diwd=false \
    -Dppp=false -Dmodem_manager=false -Dofono=false -Dteamdctl=false \
    -Dovs=false -Dbluez5_dun=false -Debpf=false \
    -Dnmcli=true -Dnmtui=false -Dnm_cloud_setup=false \
    -Dconcheck=true \
    -Dintrospection=false -Dvapi=false -Ddocs=false -Dtests=no -Dqt=false \
    -Difcfg_rh=false -Difupdown=false -Dconfig_plugins_default=keyfile \
    -Dresolvconf=no -Dnetconfig=no -Dconfig_dns_rc_manager_default=file \
    -Ddhclient=no -Ddhcpcd=no -Ddhcpcanon=no -Dconfig_dhcp_default=internal \
    -Dlibpsl=false -Dcrypto=gnutls -Dreadline=libreadline \
    -Dfirewalld_zone=false
ninja -C ../nm-build
'''
install = '''
DESTDIR="$PKGDIR" ninja -C nm-build install

mkdir -p "$PKGDIR/etc/init.d"
cat > "$PKGDIR/etc/init.d/NetworkManager" <<'EOF'
#!/sbin/openrc-run

supervisor=supervise-daemon
description="NetworkManager daemon"
command="/usr/sbin/NetworkManager"
command_args_foreground="--no-daemon"

depend() {
	need dbus
	provide net
}

start_pre() {
	checkpath -q -d -m 0755 /run/NetworkManager
}
EOF
chmod 0755 "$PKGDIR/etc/init.d/NetworkManager"
'''
