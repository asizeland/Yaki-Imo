name = "ca-certificates"
version = "2025.07.15"
category = "app-misc"

# Data-only: the Mozilla CA bundle as a single PEM, installed where
# curl/openssl are configured to look. Version is the bundle date.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://curl.se/ca/cacert-2025-07-15.pem"
filename = "cacert-2025-07-15.pem"
sha256 = "7430e90ee0cdca2d0f02b1ece46fbf255d5d0408111f009638e3b892d6ca089c"

[build]
system = "custom"

[scripts]
build = '''
# Nothing to compile: the bundle is the product.
cp cacert-2025-07-15.pem ca-certificates.crt
'''
install = '''
mkdir -p "$PKGDIR/etc/ssl/certs"
cp ca-certificates.crt "$PKGDIR/etc/ssl/certs/ca-certificates.crt"
'''
