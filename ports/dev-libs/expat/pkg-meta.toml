name = "expat"
version = "2.7.1"
category = "dev-libs"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.xz"
sha256 = "354552544b8f99012e5062f7d570ec77f14b412a3ff5c7d8d0dae62c0d217c30"

[build]
system = "custom"

[scripts]
build = '''
tar xJf expat-2.7.1.tar.xz
cd expat-2.7.1
./configure --prefix=/usr --disable-static
make
'''
install = '''
make -C expat-2.7.1 DESTDIR="$PKGDIR" install
'''
