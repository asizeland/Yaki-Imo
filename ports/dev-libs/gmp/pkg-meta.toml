name = "gmp"
version = "6.3.0"
category = "dev-libs"

# Arbitrary-precision arithmetic; nettle/gnutls chain root. m4 is a
# farm build tool.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"

[build]
system = "custom"

[scripts]
build = '''
tar xJf gmp-6.3.0.tar.xz
cd gmp-6.3.0
# GCC 15 defaults to C23, under which gmp's K&R-style configure probes
# ("void g(){}") are hard errors and configure concludes "no working
# compiler". Pinning the standard keeps the probes (and the build) in
# the dialect gmp 6.3 was written for.
CC="cc -std=gnu17" ./configure --prefix=/usr --libdir=/usr/lib --disable-static
make
'''
install = '''
make -C gmp-6.3.0 DESTDIR="$PKGDIR" install
'''
