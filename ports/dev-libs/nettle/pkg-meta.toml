name = "nettle"
version = "3.10.1"
category = "dev-libs"

# Low-level crypto primitives (hogweed needs gmp); gnutls links it.
[dependencies]
link = ["gmp"]
runtime = ["glibc", "gmp"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/nettle/nettle-3.10.1.tar.gz"
sha256 = "b0fcdd7fc0cdea6e80dcf1dd85ba794af0d5b4a57e26397eee3bc193272d9132"

[build]
system = "custom"

[scripts]
build = '''
tar xzf nettle-3.10.1.tar.gz
cd nettle-3.10.1
./configure --prefix=/usr --libdir=/usr/lib --disable-static \
    --disable-documentation \
    CPPFLAGS="-I/pkg/deps/gmp/usr/include" \
    LDFLAGS="-L/pkg/deps/gmp/usr/lib -Wl,-rpath,/usr/lib"
make
'''
install = '''
make -C nettle-3.10.1 DESTDIR="$PKGDIR" install
'''
