name = "p11-kit"
version = "0.25.5"
category = "dev-libs"

# PKCS#11 plumbing; gnutls uses its trust module against the
# ca-certificates bundle. Meson-built.
[dependencies]
link = ["libffi", "libtasn1"]
runtime = ["glibc", "libffi", "libtasn1"]
build = ["meson", "ninja", "python3", "pkgconf"]

[[source]]
url = "https://github.com/p11-glue/p11-kit/releases/download/0.25.5/p11-kit-0.25.5.tar.xz"
sha256 = "04d0a86450cdb1be018f26af6699857171a188ac6d5b8c90786a60854e1198e5"

[build]
system = "custom"

[scripts]
build = '''
tar xJf p11-kit-0.25.5.tar.xz
export PATH="/pkg/deps/meson/usr/bin:/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:/pkg/deps/pkgconf/usr/bin:$PATH"
meson setup p11-kit-0.25.5 p11-build \
    --prefix=/usr --libdir=/usr/lib --buildtype=release \
    -Dtrust_module=enabled \
    -Dtrust_paths=/etc/ssl/certs/ca-certificates.crt \
    -Dsystemd=disabled -Dgtk_doc=false -Dman=false -Dtest=false
ninja -C p11-build
'''
install = '''
export PATH="/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:$PATH"
DESTDIR="$PKGDIR" ninja -C p11-build install
'''
