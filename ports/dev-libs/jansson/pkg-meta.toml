name = "jansson"
version = "2.14"
category = "dev-libs"

# JSON library; NetworkManager uses it for team/device state.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://github.com/akheron/jansson/releases/download/v2.14/jansson-2.14.tar.gz"
sha256 = "5798d010e41cf8d76b66236cfb2f2543c8d082181d16bc3085ab49538d4b9929"

[build]
system = "custom"

[scripts]
build = '''
tar xzf jansson-2.14.tar.gz
cd jansson-2.14
./configure --prefix=/usr --disable-static
make
'''
install = '''
make -C jansson-2.14 DESTDIR="$PKGDIR" install
'''
