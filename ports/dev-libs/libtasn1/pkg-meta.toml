name = "libtasn1"
version = "4.20.0"
category = "dev-libs"

# ASN.1 parser; p11-kit and gnutls need it.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/libtasn1/libtasn1-4.20.0.tar.gz"
sha256 = "92e0e3bd4c02d4aeee76036b2ddd83f0c732ba4cda5cb71d583272b23587a76c"

[build]
system = "custom"

[scripts]
build = '''
tar xzf libtasn1-4.20.0.tar.gz
cd libtasn1-4.20.0
./configure --prefix=/usr --disable-static
make
'''
install = '''
make -C libtasn1-4.20.0 DESTDIR="$PKGDIR" install
'''
