name = "glib"
version = "2.84.3"
category = "dev-libs"

# The GLib/GIO core library — dbus and NetworkManager build on it.
# Meson-built: the build deps (meson, ninja, python3, pkgconf) are
# bound at /pkg/deps and put on PATH by the build script; they are NOT
# runtime deps.
[dependencies]
link = ["libffi", "pcre2", "zlib"]
runtime = ["glibc", "libffi", "pcre2", "zlib"]
build = ["meson", "ninja", "python3", "pkgconf"]

[[source]]
url = "https://download.gnome.org/sources/glib/2.84/glib-2.84.3.tar.xz"
sha256 = "aa4f87c3225bf57ca85f320888f7484901a17934ca37023c3bd8435a72db863e"

[build]
system = "custom"

[scripts]
build = '''
tar xJf glib-2.84.3.tar.xz
export PATH="/pkg/deps/meson/usr/bin:/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:/pkg/deps/pkgconf/usr/bin:$PATH"
meson setup glib-2.84.3 glib-build \
    --prefix=/usr --libdir=/usr/lib --buildtype=release \
    -Ddefault_library=shared \
    -Dman-pages=disabled -Dtests=false -Dintrospection=disabled \
    -Dselinux=disabled -Ddtrace=false -Dsystemtap=false \
    -Dsysprof=disabled -Ddocumentation=false -Dlibmount=disabled
ninja -C glib-build
'''
install = '''
export PATH="/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:$PATH"
DESTDIR="$PKGDIR" ninja -C glib-build install

# Byte-compile the installed Python tooling (gdbus-codegen's codegen
# module, gdb pretty-printers) so runtime __pycache__ writes can't
# pollute the store through the activation symlinks.
python3 -m compileall -q "$PKGDIR/usr/share/glib-2.0"
'''
