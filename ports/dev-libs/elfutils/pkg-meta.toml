name = "elfutils"
version = "0.193"
category = "dev-libs"

[dependencies]
link = ["glibc", "gcc", "zlib"]
runtime = ["glibc", "gcc", "zlib"]
build = ["gcc", "make", "linux-headers", "pkgconf"]

[[source]]
url = "https://sourceware.org/elfutils/ftp/0.193/elfutils-0.193.tar.bz2"
sha256 = "7857f44b624f4d8d421df851aaae7b1402cfe6bcdd2d8049f15fc07d3dde7635"

[build]
system = "custom"

[scripts]
build = '''
tar xjf elfutils-0.193.tar.bz2
cd elfutils-0.193
export PATH="/pkg/deps/pkgconf/usr/bin:$PATH"
./configure --prefix=/usr --libdir=/usr/lib \
    --disable-debuginfod --disable-libdebuginfod \
    --without-bzlib --without-lzma --without-zstd
make
'''
install = '''
make -C elfutils-0.193 DESTDIR="$PKGDIR" install
'''
