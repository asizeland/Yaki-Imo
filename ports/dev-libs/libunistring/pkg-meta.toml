name = "libunistring"
version = "1.3"
category = "dev-libs"

# Unicode string handling; gnutls links it for IDN.
[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/libunistring/libunistring-1.3.tar.xz"
sha256 = "f245786c831d25150f3dfb4317cda1acc5e3f79a5da4ad073ddca58886569527"

[build]
system = "custom"

[scripts]
build = '''
tar xJf libunistring-1.3.tar.xz
cd libunistring-1.3
./configure --prefix=/usr --disable-static
make
'''
install = '''
make -C libunistring-1.3 DESTDIR="$PKGDIR" install
'''
