name = "libffi"
version = "3.4.8"
category = "dev-libs"

[dependencies]
runtime = ["glibc"]

[[source]]
url = "https://github.com/libffi/libffi/releases/download/v3.4.8/libffi-3.4.8.tar.gz"
sha256 = "bc9842a18898bfacb0ed1252c4febcc7e78fa139fd27fdc7a3e30d9d9356119b"

[build]
system = "custom"

[scripts]
build = '''
tar xzf libffi-3.4.8.tar.gz
cd libffi-3.4.8
# libffi hides its headers under $libdir/libffi-<ver>/include; every
# consumer expects them in the normal include dir (same fix LFS uses).
sed -e '/^includesdir/ s/$(libdir).*$/$(includedir)/' -i include/Makefile.in
./configure --prefix=/usr --libdir=/usr/lib --disable-static \
    --disable-multi-os-directory
make
'''
install = '''
make -C libffi-3.4.8 DESTDIR="$PKGDIR" install
'''
