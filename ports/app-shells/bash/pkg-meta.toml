name = "bash"
version = "5.3"
category = "app-shells"

[dependencies]
link = ["ncurses"]
runtime = ["glibc", "ncurses"]

[[source]]
url = "https://ftpmirror.gnu.org/gnu/bash/bash-5.3.tar.gz"
sha256 = "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba"

[build]
system = "custom"

[scripts]
build = '''
tar xzf bash-5.3.tar.gz
cd bash-5.3
# bash's bundled readline wants a termcap library; point it at the
# pkg-built ncurses. termcap/tinfo probes are pre-seeded "no": otherwise
# the HOST's libtermcap/libtinfo win through the read-only host binds
# (undeclared linkage, gate-fatal) and -lncursesw is never tried.
ac_cv_lib_termcap_tgetent=no ac_cv_lib_tinfo_tgetent=no \
./configure --prefix=/usr --disable-nls --without-bash-malloc \
    CPPFLAGS="-I/pkg/deps/ncurses/usr/include" \
    LDFLAGS="-L/pkg/deps/ncurses/usr/lib"
make
'''
install = '''
make -C bash-5.3 DESTDIR="$PKGDIR" install
# /bin/sh: init, configure scripts, and half of unix spawn it by that
# exact path. bash running as "sh" is POSIX mode — the standard stand-in.
mkdir -p "$PKGDIR/bin"
ln -s ../usr/bin/bash "$PKGDIR/bin/sh"
'''
